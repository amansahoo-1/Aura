# .github/workflows/ci-pipeline.yml
name: Aura CI Pipeline 🚀

# Triggers: Run this workflow on pushes and pull requests to main and develop branches
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.project }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["18.x"]
        project: ["backend", "frontend"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # Correctly use npm for caching
          cache: "npm"
          # This line below is needed to specify the path for the cache
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        # Correctly use npm install
        run: npm install
        working-directory: ./${{ matrix.project }}

      - name: Run Linter ✅
        run: npm run lint
        working-directory: ./${{ matrix.project }}

      - name: Run Tests 🧪
        run: npm test
        working-directory: ./${{ matrix.project }}

      - name: Run Build 🏗️
        if: matrix.project == 'frontend'
        run: npm run build
        working-directory: ./${{ matrix.project }}
