# .github/workflows/ci-pipeline.yml
name: Aura CI Pipeline 🚀

# Triggers: Run this workflow on pushes and pull requests to main and develop branches
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.project }})
    runs-on: ubuntu-latest

    # Matrix Strategy: Run the same steps for both frontend and backend
    strategy:
      matrix:
        node-version: ["18.x"]
        project: ["backend", "frontend"]

    steps:
      # 1. Get the code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup the specified version of Node.js
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm" # Use pnpm for caching

      # 3. Install dependencies using pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./${{ matrix.project }}

      # 4. Run the linter to check code style
      - name: Run Linter ✅
        run: pnpm run lint
        working-directory: ./${{ matrix.project }}

      # 5. Run tests to ensure code correctness
      - name: Run Tests 🧪
        run: pnpm test
        # The backend test script already includes coverage flags
        working-directory: ./${{ matrix.project }}

      # 6. Run the build command (only for the frontend)
      - name: Run Build 🏗️
        if: matrix.project == 'frontend'
        run: pnpm run build
        working-directory: ./${{ matrix.project }}
